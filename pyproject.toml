[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "statio"
version = "0.1.0"
description = "A statistics-first Python library."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["statio*"]